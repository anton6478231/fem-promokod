<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>ФЭМ — сайт промокодов</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.8.1/build/stlite.css"
    />
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: #f7f7f8;
      }
      #boot {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        height: 100%;
        color: #111827;
        text-align: center;
        padding: 24px;
      }
      #boot small {
        color: #6b7280;
        max-width: 360px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <strong>Загружаю финансовую модель</strong>
        <small>Первый запуск скачивает Python в браузер и может занять 20–40 секунд. Дальше страница открывается быстрее.</small>
      </div>
    </div>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
